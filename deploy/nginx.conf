server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El .wasm pesa ~38 MB; comprimido viaja en ~10 MB (feedback: carga lenta).
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript application/octet-stream text/css;

    # Los archivos del export no llevan hash en el nombre: el navegador revalida
    # (304 si no cambió), así que al re-desplegar todos reciben la versión nueva.
    add_header Cache-Control "no-cache";

    # El export usa thread_support=false, así que no necesita COOP/COEP.
    location / {
        try_files $uri $uri/ =404;
    }
}
